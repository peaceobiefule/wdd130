<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Get in touch with White Rapids Adventures. Find our contact details, staff, and reach out using the form.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Peace">
  <title>Contact Us - White Rapids Adventures</title>

  <!-- Google Fonts: Roboto (heading) & Arimo (text) -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Arimo&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/styles.css">

  <style>
    .contact-info, .employee-profiles, .contact-form {
      padding: 1rem;
      max-width: 900px;
      margin: 0 auto;
    }

    .contact-info p {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }

    .map-container {
      margin: 1rem 0;
      text-align: center;
    }

    .map-container iframe {
      width: 100%;
      height: 300px;
      border: none;
      border-radius: 8px;
    }

    .employee-profiles {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: space-around;
      text-align: center;
    }

    .employee-profiles figure {
      width: 200px;
    }

    .employee-profiles img {
      width: 100%;
      height: auto;
      border-radius: 8px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    form label {
      font-weight: bold;
    }

    form input[type="text"],
    form input[type="email"],
    form textarea {
      padding: 0.5rem;
      border-radius: 5px;
      border: 1px solid #ccc;
      width: 100%;
      font-size: 1rem;
    }

    .radio-group label {
      display: block;
      font-weight: normal;
    }

    .newsletter {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    form button[type="submit"] {
      background-color: #0077cc;
      color: white;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
    }

    form button[type="submit"]:hover {
      background-color: #005fa3;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header-grid">
    <img src="images/logo.png" alt="Rafting Site Logo" class="logo">
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="trips.html">Trips</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <!-- Main Content -->
  <main>
    <section class="contact-info">
      <h1>Contact White Rapids Adventures</h1>
      <p><strong>Address:</strong> 123 Rapids Way, River City, RC 45678</p>
      <p><strong>Phone:</strong> +1 (555) 123-4567</p>
      <p><strong>Email:</strong> info@whiterapids.com</p>

      <div class="map-container">
        <iframe 
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.077298713833!2d-122.42067968468186!3d37.778519179758245!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80858064b3a551b3%3A0x30a65e75e9f142b7!2sCity%20Hall%2C%20San%20Francisco%2C%20CA!5e0!3m2!1sen!2sus!4v1601949273393!5m2!1sen!2sus" 
          allowfullscreen="" 
          loading="lazy">
        </iframe>
      </div>
    </section>

    <section class="employee-profiles">
      <figure>
        <img src="images/employee1.jpeg" alt="Employee 1">
        <figcaption>Jane - Adventure Guide</figcaption>
      </figure>
      <figure>
        <img src="images/employee2.jpeg" alt="Employee 2">
        <figcaption>Mike - Customer Support</figcaption>
      </figure>
      <figure>
        <img src="images/employee3.jpeg" alt="Employee 3">
        <figcaption>Sara - Booking Specialist</figcaption>
      </figure>
    </section>

    <section class="contact-form">
      <h2>Send Us a Message</h2>
      <form>
        <label for="name">Your Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Your Email:</label>
        <input type="email" id="email" name="email" required>

        <fieldset class="radio-group">
          <legend>Purpose of the Message:</legend>
          <label><input type="radio" name="purpose" value="general" required> General Inquiry</label>
          <label><input type="radio" name="purpose" value="reservation"> Reservation Question</label>
          <label><input type="radio" name="purpose" value="suggestion"> Website Suggestion</label>
        </fieldset>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <label class="newsletter">
          <input type="checkbox" name="subscribe">
          Please subscribe me to the monthly newsletter
        </label>

        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 White Rapids Adventures | Peace</p>
    <nav class="socialmedia">
      <a href="https://facebook.com" target="_blank">
        <img src="images/facebook.jpeg" alt="Facebook">
      </a>
      <a href="https://twitter.com" target="_blank">
        <img src="images/twitter.jpeg" alt="Twitter">
      </a>
      <a href="https://instagram.com" target="_blank">
        <img src="images/instagram.jpeg" alt="Instagram">
      </a>
    </nav>
    <p><a href="https://app.moqups.com/MjmCqwob3InfZrKNzB1S63aW4VfoviGh/view/page/ad12de680" target="_blank">View Contact Page Wireframe</a></p>

  </footer>
</body>
</html>
